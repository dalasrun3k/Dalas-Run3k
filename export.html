<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ekspor Data Peserta | Dalas Run</title>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #43cea2, #185a9d);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
    }

    button {
      background: #ffffff;
      color: #185a9d;
      border: none;
      padding: 15px 30px;
      border-radius: 12px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #43cea2;
      color: white;
      transform: scale(1.05);
    }

    footer {
      position: absolute;
      bottom: 15px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <h1>Ekspor Data Peserta Dalas Run</h1>
  <p>Klik tombol di bawah untuk mengunduh data peserta dalam format Excel</p>
  <button id="exportBtn">Ekspor ke Excel</button>
  <footer>© 2025 Dalas Run Committee</footer>

  <script>
    // Konfigurasi Firebase kamu
    const firebaseConfig = {
      apiKey: "ISI_API_KEY_MU",
      authDomain: "dalas-run.firebaseapp.com",
      projectId: "dalas-run",
      storageBucket: "dalas-run.firebasestorage.app",
      messagingSenderId: "903129658881",
      appId: "1:903129658881:web:98593518aa602aaa7bf200",
      measurementId: "G-BRWP0LZFYG"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("exportBtn").addEventListener("click", async () => {
      const snapshot = await db.collection("pendaftar").get();
      let data = [];

      snapshot.forEach((doc) => {
        const d = doc.data();
        data.push({
          "Nomor Peserta": d.nomorPeserta || "",
          "Nama": d.nama || "",
          "Kategori": d.kategori || "",
          "Jenis Kelamin": d.jenisKelamin || "",
          "Ukuran Jersey": d.ukuranJersey || ""
        });
      });

      // Urutkan berdasarkan nomor peserta
      data.sort((a, b) => {
        const numA = parseInt(a["Nomor Peserta"]);
        const numB = parseInt(b["Nomor Peserta"]);
        return numA - numB;
      });

      // Buat file Excel
      const worksheet = XLSX.utils.json_to_sheet(data);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Data Peserta");

      // Gaya header biar tebal
      const range = XLSX.utils.decode_range(worksheet['!ref']);
      for (let C = range.s.c; C <= range.e.c; ++C) {
        const address = XLSX.utils.encode_cell({ r: 0, c: C });
        if (!worksheet[address]) continue;
        worksheet[address].s = {
          font: { bold: true },
          alignment: { horizontal: "center" }
        };
      }

      XLSX.writeFile(workbook, "Data_Peserta_Dalas_Run.xlsx");
    });
  </script>
</body>
</html>
