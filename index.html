<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Ditutup | Dalas Run</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ff4d4d, #ff9966);
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      animation: fadeInDown 1s ease;
    }

    p {
      font-size: 1.2rem;
      opacity: 0.9;
      animation: fadeIn 2s ease;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px 60px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
      animation: popUp 0.8s ease;
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    /* Tombol ekspor */
    #exportBtn {
      margin-top: 25px;
      padding: 10px 20px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease;
    }

    #exportBtn:hover {
      background: #45a049;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popUp {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>

  <!-- Library untuk Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div class="card">
    <h1>Pendaftaran Dalas Run Telah Ditutup</h1>
    <p>Terima kasih kepada seluruh peserta yang telah mendaftar!<br>
    Nantikan informasi dan event menarik berikutnya 💪🏃‍♂️</p>

    <!-- Tombol ekspor -->
    <button id="exportBtn">Ekspor Data ke Excel</button>
  </div>

  <footer>© 2025 Dalas Run Committee</footer>

  <!-- Script Firebase + Ekspor Excel -->
  <script type="module">
    // Import Firebase SDK
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔥 Masukkan konfigurasi Firebase kamu di sini (JANGAN DIBAGIKAN KE ORANG LAIN)
   const firebaseConfig = {
    apiKey: "AIzaSyBugeV9lOylEyrwY9gVZvv8HP1NPBb4WiI",
    authDomain: "dalas-run.firebaseapp.com",
    projectId: "dalas-run",
    storageBucket: "dalas-run.firebasestorage.app",
    messagingSenderId: "903129658881",
    appId: "1:903129658881:web:98593518aa602aaa7bf200",
    measurementId: "G-BRWP0LZFYG"
  };
    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Fungsi ekspor
    async function exportToExcel() {
      const querySnapshot = await getDocs(collection(db, "pendaftar"));
      const data = [];

      querySnapshot.forEach((doc) => {
        const d = doc.data();
        data.push({
          Nomor_Peserta: d.nomorPeserta || "",
          Nama: d.nama || "",
          Kategori: d.kategori || "",
          Jenis_Kelamin: d.jenisKelamin || "",
          Ukuran_Jersey: d.ukuranJersey || "",
          Pembayaran: d.pembayaran || "",
          Telepon: d.telepon || "",
          Waktu: d.waktu || ""
        });
      });

      if (data.length === 0) {
        alert("Tidak ada data pendaftar ditemukan!");
        return;
      }

      // 🔢 Urutkan berdasarkan nomor peserta
      data.sort((a, b) => {
        const numA = parseInt(a.Nomor_Peserta.replace(/\D/g, "")) || 0;
        const numB = parseInt(b.Nomor_Peserta.replace(/\D/g, "")) || 0;
        return numA - numB;
      });

      // Buat dan unduh file Excel
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Data Pendaftar");
      XLSX.writeFile(wb, "Data_Pendaftar_Dalas_Run.xlsx");
    }

    // Event klik tombol
    document.getElementById("exportBtn").addEventListener("click", exportToExcel);
  </script>
</body>
</html>
