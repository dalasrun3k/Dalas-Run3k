<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Export Data Pendaftar - Dalas Run</title>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f8fafc;
      color: #333;
      text-align: center;
      margin-top: 100px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>📄 Ekspor Data Pendaftar Dalas Run</h1>
  <button id="exportBtn">Ekspor ke Excel</button>

  <script type="module">
    // --- Konfigurasi Firebase ---
    const firebaseConfig = {
      apiKey: "AIzaSyBugeV9lOylEyrwY9gVZvv8HP1NPBb4WiI",
      authDomain: "dalas-run.firebaseapp.com",
      projectId: "dalas-run",
      storageBucket: "dalas-run.firebasestorage.app",
      messagingSenderId: "903129658881",
      appId: "1:903129658881:web:98593518aa602aaa7bf200",
      measurementId: "G-BRWP0LZFYG"
    };

    // Inisialisasi Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    document.getElementById("exportBtn").addEventListener("click", async () => {
      const snapshot = await db.collection("pendaftar").get();
      let data = [];

      snapshot.forEach(doc => {
        const d = doc.data();
        data.push({
          "Nomor Peserta": d.nomorPeserta || "",
          "Nama": d.nama || "",
          "Kategori": d.kategori || "",
          "Jenis Kelamin": d.jenisKelamin || "",
          "Ukuran Jersey": d.ukuranJersey || ""
        });
      });

      // Urutkan berdasarkan nomor peserta
      data.sort((a, b) => parseInt(a["Nomor Peserta"]) - parseInt(b["Nomor Peserta"]));

      // Buat worksheet dan workbook Excel
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Data Pendaftar");

      // Atur lebar kolom otomatis
      const columnWidths = Object.keys(data[0]).map(key => ({ wch: key.length + 10 }));
      ws["!cols"] = columnWidths;

      // Simpan file Excel
      XLSX.writeFile(wb, "Data_Pendaftar_DalasRun.xlsx");
    });
  </script>
</body>
</html>
